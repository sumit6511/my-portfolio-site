<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t">
  <title id="t">Live Location Tracker — browser geolocation streamed over WebSockets onto a live map</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15151b"/><stop offset="1" stop-color="#0e0e12"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b8cf8" stop-opacity="0.24"/><stop offset="1" stop-color="#8b8cf8" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s{font-size:12px;fill:#a3a3ad}.m{font-size:11px;fill:#71717c;letter-spacing:.08em}.k{font-size:10px;fill:#71717c;letter-spacing:.14em}
    .b{fill:#17171d;stroke:#fff;stroke-opacity:.14}.r{stroke:#fff;stroke-opacity:.09;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="500" cy="260" r="200" fill="url(#glow)"/>

  <!-- streets -->
  <g class="r">
    <path d="M0 150C120 140 200 190 330 170S560 120 800 160"/>
    <path d="M0 330C160 300 260 360 420 330S640 290 800 320"/>
    <path d="M180 0C200 120 160 260 220 500"/>
    <path d="M560 0C540 140 600 300 580 500"/>
    <path d="M360 40C400 200 340 320 420 500"/>
  </g>
  <g stroke="#fff" stroke-opacity=".05" fill="none" stroke-width="14" stroke-linecap="round">
    <path d="M0 150C120 140 200 190 330 170S560 120 800 160"/>
    <path d="M560 0C540 140 600 300 580 500"/>
  </g>

  <!-- route -->
  <path d="M120 400C200 380 240 300 300 292S380 330 440 300 520 210 588 236" fill="none" stroke="#8b8cf8" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
  <circle cx="120" cy="400" r="5" fill="#71717c"/>
  <circle cx="120" cy="400" r="9" fill="none" stroke="#71717c" stroke-opacity=".5"/>

  <!-- live pin -->
  <g transform="translate(588 236)">
    <circle r="54" fill="#8b8cf8" fill-opacity=".05" stroke="#8b8cf8" stroke-opacity=".18"/>
    <circle r="34" fill="#8b8cf8" fill-opacity=".08" stroke="#8b8cf8" stroke-opacity=".32"/>
    <circle r="16" fill="#8b8cf8" fill-opacity=".18" stroke="#8b8cf8" stroke-opacity=".6"/>
    <circle r="7" fill="#8b8cf8"/>
    <circle r="7" fill="none" stroke="#0e0e12" stroke-width="2"/>
  </g>

  <!-- second user -->
  <g transform="translate(300 292)">
    <circle r="18" fill="#a3a3ad" fill-opacity=".06" stroke="#a3a3ad" stroke-opacity=".3"/>
    <circle r="5" fill="#ededf0"/>
  </g>

  <!-- status -->
  <rect class="b" x="48" y="48" width="236" height="44" rx="22"/>
  <circle cx="72" cy="70" r="5" fill="#8b8cf8"/>
  <circle cx="72" cy="70" r="9" fill="none" stroke="#8b8cf8" stroke-opacity=".4"/>
  <text class="t s" x="90" y="75">live · socket.io connected</text>

  <rect class="b" x="48" y="104" width="236" height="44" rx="10"/>
  <text class="t k" x="64" y="122">PEERS ON MAP</text>
  <text class="t s" x="64" y="140">navigator.geolocation → ws</text>

  <!-- readout -->
  <rect class="b" x="556" y="386" width="196" height="52" rx="10"/>
  <text class="t k" x="572" y="406">POSITION</text>
  <text class="t s" x="572" y="426">27.7172° N · 85.3240° E</text>

  <text class="t m" x="48" y="462">live-location-tracker / real-time</text>
  <text class="t m" x="752" y="462" text-anchor="end">node.js · socket.io · leaflet</text>
</svg>
