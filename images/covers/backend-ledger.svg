<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t">
  <title id="t">Backend Ledger — double-entry table where debits equal credits, with JWT auth, idempotency keys and MongoDB transactions</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15151b"/><stop offset="1" stop-color="#0e0e12"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b8cf8" stop-opacity="0.2"/><stop offset="1" stop-color="#8b8cf8" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .s{font-size:12px;fill:#a3a3ad}.m{font-size:11px;fill:#71717c;letter-spacing:.08em}.k{font-size:10px;fill:#71717c;letter-spacing:.14em}
    .w{font-size:13px;fill:#ededf0}.b{fill:#17171d;stroke:#fff;stroke-opacity:.14}
  </style>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="290" cy="250" r="200" fill="url(#glow)"/>

  <!-- ledger table -->
  <rect class="b" x="48" y="96" width="484" height="290" rx="12"/>
  <text class="t k" x="72" y="126">JOURNAL ENTRY  #000241</text>
  <line x1="48" y1="140" x2="532" y2="140" stroke="#fff" stroke-opacity=".1"/>
  <text class="t k" x="72" y="164">ACCOUNT</text>
  <text class="t k" x="352" y="164" text-anchor="end">DEBIT</text>
  <text class="t k" x="500" y="164" text-anchor="end">CREDIT</text>
  <line x1="48" y1="176" x2="532" y2="176" stroke="#fff" stroke-opacity=".1"/>

  <text class="t w" x="72" y="206">wallet:alice</text>
  <text class="t w" x="352" y="206" text-anchor="end">250.00</text>
  <text class="t m" x="500" y="206" text-anchor="end">—</text>

  <text class="t w" x="72" y="240">wallet:bob</text>
  <text class="t m" x="352" y="240" text-anchor="end">—</text>
  <text class="t w" x="500" y="240" text-anchor="end">250.00</text>

  <text class="t s" x="72" y="274">fee:platform</text>
  <text class="t s" x="352" y="274" text-anchor="end">—</text>
  <text class="t s" x="500" y="274" text-anchor="end">0.00</text>

  <line x1="72" y1="296" x2="508" y2="296" stroke="#8b8cf8" stroke-opacity=".5"/>
  <text class="t w" x="72" y="326">Σ</text>
  <text class="t" x="352" y="326" text-anchor="end" font-size="13" fill="#8b8cf8">250.00</text>
  <text class="t" x="500" y="326" text-anchor="end" font-size="13" fill="#8b8cf8">250.00</text>

  <g transform="translate(72 348)">
    <circle cx="7" cy="7" r="7" fill="#8b8cf8"/>
    <path d="M3.5 7.2l2.4 2.4 4.8-5" fill="none" stroke="#0a0a0c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t k" x="22" y="11" fill="#a3a3ad">BALANCED · ATOMIC</text>
  </g>

  <!-- guarantees -->
  <g>
    <rect class="b" x="568" y="118" width="184" height="52" rx="10"/>
    <text class="t k" x="584" y="138">AUTH</text>
    <text class="t s" x="584" y="158">Bearer eyJhbGciOi…</text>
    <line x1="532" y1="144" x2="568" y2="144" stroke="#71717c" stroke-dasharray="3 4"/>

    <rect class="b" x="568" y="196" width="184" height="52" rx="10"/>
    <text class="t k" x="584" y="216">IDEMPOTENCY-KEY</text>
    <text class="t s" x="584" y="236">7f3a-91c2-… (replay safe)</text>
    <line x1="532" y1="222" x2="568" y2="222" stroke="#71717c" stroke-dasharray="3 4"/>

    <rect x="568" y="274" width="184" height="52" rx="10" fill="#8b8cf8" fill-opacity=".08" stroke="#8b8cf8" stroke-opacity=".5"/>
    <text class="t k" x="584" y="294">MONGODB</text>
    <text class="t s" x="584" y="314">session.withTransaction()</text>
    <line x1="532" y1="300" x2="568" y2="300" stroke="#8b8cf8" stroke-opacity=".6" stroke-dasharray="3 4"/>
  </g>

  <text class="t m" x="48" y="462">backend-ledger / double-entry transaction api</text>
  <text class="t m" x="752" y="462" text-anchor="end">node.js · express · mongodb</text>
</svg>
