<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b1c"/>
      <stop offset="45%" stop-color="#0b1128"/>
      <stop offset="100%" stop-color="#0c1330"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e60ce"/>
      <stop offset="50%" stop-color="#64dfdf"/>
      <stop offset="100%" stop-color="#7b90ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5e60ce" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5e60ce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64dfdf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#64dfdf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <circle cx="120" cy="90" r="220" fill="url(#glow1)"/>
  <circle cx="700" cy="520" r="240" fill="url(#glow2)"/>

  <circle cx="400" cy="215" r="72" fill="rgba(255,255,255,0.045)" stroke="url(#text-gradient)" stroke-width="2"/>
  <g>
    <rect x="354" y="203" width="8" height="24" rx="4" fill="#5e60ce"/>
    <rect x="368" y="187" width="8" height="56" rx="4" fill="#64dfdf"/>
    <rect x="382" y="167" width="8" height="96" rx="4" fill="#7b90ff"/>
    <rect x="396" y="187" width="8" height="56" rx="4" fill="#64dfdf"/>
    <rect x="410" y="203" width="8" height="24" rx="4" fill="#5e60ce"/>
    <rect x="424" y="191" width="8" height="48" rx="4" fill="#64dfdf"/>
    <rect x="438" y="203" width="8" height="24" rx="4" fill="#7b90ff"/>
  </g>

  <text x="400" y="345" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="url(#text-gradient)">VoxTube</text>
  <text x="400" y="380" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#9aa3c4">FINAL YEAR PROJECT &#183; NLP PLATFORM</text>

