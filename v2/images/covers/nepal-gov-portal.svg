  <circle cx="150" cy="90" r="220" fill="url(#glow1)"/>
  <circle cx="660" cy="510" r="230" fill="url(#glow2)"/>

  <circle cx="400" cy="215" r="72" fill="rgba(255,255,255,0.045)" stroke="url(#text-gradient)" stroke-width="2"/>
  <g>
    <polygon points="400,167 353,202 447,202" fill="url(#text-gradient)"/>
    <rect x="351" y="202" width="98" height="7" fill="url(#text-gradient)" opacity="0.85"/>
    <rect x="359" y="211" width="9" height="38" fill="#f7f8fb" opacity="0.85"/>
    <rect x="381" y="211" width="9" height="38" fill="#f7f8fb" opacity="0.85"/>
    <rect x="403" y="211" width="9" height="38" fill="#f7f8fb" opacity="0.85"/>
    <rect x="425" y="211" width="9" height="38" fill="#f7f8fb" opacity="0.85"/>
    <rect x="351" y="251" width="98" height="8" rx="1" fill="url(#text-gradient)" opacity="0.85"/>
  </g>

  <text x="400" y="345" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="url(#text-gradient)">Nepal Gov Portal</text>
  <text x="400" y="380" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#9aa3c4">GROUP PROJECT &#183; SERVICES PROTOTYPE</text>

