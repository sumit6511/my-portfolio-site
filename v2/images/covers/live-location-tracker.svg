<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b1c"/>
      <stop offset="45%" stop-color="#0b1128"/>
      <stop offset="100%" stop-color="#0c1330"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e60ce"/>
      <stop offset="50%" stop-color="#64dfdf"/>
      <stop offset="100%" stop-color="#7b90ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64dfdf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#64dfdf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5e60ce" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5e60ce" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <circle cx="670" cy="90" r="220" fill="url(#glow1)"/>
  <circle cx="120" cy="520" r="230" fill="url(#glow2)"/>

  <circle cx="400" cy="215" r="72" fill="rgba(255,255,255,0.045)" stroke="url(#text-gradient)" stroke-width="2"/>
  <g>
    <circle cx="400" cy="230" r="46" fill="none" stroke="url(#text-gradient)" stroke-width="2" stroke-dasharray="3 7" opacity="0.55"/>
    <circle cx="400" cy="230" r="30" fill="none" stroke="url(#text-gradient)" stroke-width="2" stroke-dasharray="3 6" opacity="0.75"/>
    <path d="M400,225 C400,225 372,193 372,171 A28,28 0 1,1 428,171 C428,193 400,225 400,225 Z" fill="url(#text-gradient)"/>
    <circle cx="400" cy="170" r="10" fill="#0c1330"/>
  </g>

  <text x="400" y="352" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="url(#text-gradient)">Live Location Tracker</text>
  <text x="400" y="386" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="14" letter-spacing="4" fill="#9aa3c4">REAL-TIME &#183; WEBSOCKETS</text>

  <text x="400" y="522" text-anchor="middle" font-family="'Roboto Mono', 'Courier New', monospace" font-size="15" fill="#8792b4">Node.js &#183; Socket.IO &#183; Leaflet</text>
  <text x="32" y="568" font-family="'Roboto Mono', 'Courier New', monospace" font-size="13" fill="rgba(255,255,255,0.28)">sumit6511/live-location-tracker</text>
</svg>
